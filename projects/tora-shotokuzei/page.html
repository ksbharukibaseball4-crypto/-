<script>
const Q = new URLSearchParams(location.search); const MODE = Q.get('m') || 'h'; document.body.classList.add(MODE); const BRAND = Q.get('brand') === '1'; if (BRAND) { document.body.classList.add('brand'); document.getElementById('seal').style.display = 'flex'; }
const stage = document.getElementById('stage');
if (MODE === 'v') stage.style.transform = `translate(40px, 640px) scale(${1000 / 1920})`;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const eo = (x) => 1 - Math.pow(1 - clamp(x), 3);
const eio = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const back = (x) => { x = clamp(x); const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
// element helpers --------------------------------------------------------------
function E(parent, html, x, y, cls = 'a', w) { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; d.style.left = x + 'px'; d.style.top = y + 'px'; if (w) d.style.width = w + 'px'; parent.appendChild(d); return d; }
function show(el, k, dy = 30, sc0 = 1) { k = clamp(k); el.style.opacity = k; el.style.transform = `translateY(${(1 - eo(k)) * dy}px) scale(${lerp(sc0, 1, back(k))})`; }
function pos(el, x, y, o = 1, s = 1) { el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.opacity = o; el.style.transform = `scale(${s})`; }
const appear = (lt, at, d = 0.5) => (lt - at) / d;
// icons -------------------------------------------------------------------------
const IC = {
 person: (c = '#1d2940', s = 110) => `<svg width="${s}" height="${s}" viewBox="0 0 110 110" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round"><circle cx="55" cy="36" r="18"/><path d="M22 98c4-22 18-32 33-32s29 10 33 32"/></svg>`,

 gov: (c = '#cf4a3c', s = 110) => `<svg width="${s}" height="${s}" viewBox="0 0 120 110" fill="none" stroke="${c}" stroke-width="5" stroke-linejoin="round"><path d="M12 38 L60 12 L108 38 Z"/><path d="M22 46v40M44 46v40M76 46v40M98 46v40M10 96h100"/></svg>`,
 doc: (c = '#1d2940', s = 100) => `<svg width="${s}" height="${s}" viewBox="0 0 100 100" fill="none" stroke="${c}" stroke-width="5" stroke-linejoin="round"><path d="M24 10h38l16 16v64H24z"/><path d="M62 10v16h16M36 46h28M36 60h28M36 74h18"/></svg>`,
 calc: (c = '#1d2940', s = 100) => `<svg width="${s}" height="${s}" viewBox="0 0 100 100" fill="none" stroke="${c}" stroke-width="5" stroke-linejoin="round"><rect x="22" y="10" width="56" height="80" rx="8"/><rect x="32" y="20" width="36" height="16"/><path d="M34 50h4M48 50h4M62 50h4M34 64h4M48 64h4M62 64h4M34 78h4M48 78h4M62 78h4"/></svg>`,

 spring: (c = '#2f6fb3', s = 120) => `<svg width="${s}" height="${s}" viewBox="0 0 120 120" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M60 14 C44 38 36 52 36 64 a24 24 0 0 0 48 0 C84 52 76 38 60 14Z"/><path d="M14 104 q12-10 24 0 t24 0 t24 0 t24 0"/><path d="M50 66 a10 10 0 0 0 10 10"/></svg>`,
 book: (c = '#1d2940', s = 110) => `<svg width="${s}" height="${s}" viewBox="0 0 110 110" fill="none" stroke="${c}" stroke-width="5" stroke-linejoin="round"><path d="M14 22 C30 16 44 18 55 26 C66 18 80 16 96 22 V88 C80 82 66 84 55 92 C44 84 30 82 14 88Z"/><path d="M55 26V92"/></svg>`,
 bulb: (c = '#c79a3e', s = 110) => `<svg width="${s}" height="${s}" viewBox="0 0 110 110" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round"><path d="M40 70 C30 62 26 52 26 44 a29 29 0 0 1 58 0 c0 8-4 18-14 26 v10 H40z"/><path d="M42 90h26M46 100h18M55 4v6M20 16l5 5M90 16l-5 5"/></svg>`,
 cal: (c = '#1d2940', s = 110) => `<svg width="${s}" height="${s}" viewBox="0 0 110 110" fill="none" stroke="${c}" stroke-width="5" stroke-linejoin="round"><rect x="16" y="22" width="78" height="72" rx="8"/><path d="M16 42h78M36 12v20M74 12v20"/></svg>`,
 play: (c = '#fff', s = 70) => `<svg width="${s}" height="${s}" viewBox="0 0 70 70"><path d="M24 16 L56 35 L24 54Z" fill="${c}"/></svg>`,
 check: (c = '#2f8f5b', s = 44) => `<svg width="${s}" height="${s}" viewBox="0 0 44 44" fill="none" stroke="${c}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 23 L18 33 L36 12"/></svg>`,

};
const circ = (html, s = 200) => `<div class="ic" style="width:${s}px;height:${s}px">${html}</div>`;
const svgPath = (d, stroke = '#cf4a3c', w = 4, dash = '10 12') => `<svg width="1920" height="1080" style="position:absolute;left:0;top:0;overflow:visible"><path d="${d}" stroke="${stroke}" stroke-width="${w}" fill="none" stroke-dasharray="${dash}"/></svg>`;
// ------------------------------------------------------------------------------
let TL; const GROUPS = []; const X = () => {};
const G = (scenes, chap, head, build) => GROUPS.push({ scenes, chap, head, build });
const H2 = (g, html) => E(g, html, 0, 150, 'a h2');
// 1 title
X([0], ['00', 'MONEY CLASS'], ['シリーズ', '本当は<br>学校で教えて欲しい'], (g) => {
  const tag = E(g, 'MONEY CLASS', 0, 300, 'a sm', 1920); tag.style.fontFamily = 'Inter'; tag.style.letterSpacing = '.5em'; tag.style.fontSize = '26px';
  const a = E(g, '本当は', 0, 360, 'a mc', 1920); a.style.fontSize = '76px';
  const b = E(g, '学校で<em>教えて欲しい</em>', 0, 460, 'a mc', 1920); b.style.fontSize = '132px';
  const rule = E(g, '', 760, 680, 'a'); Object.assign(rule.style, { width: '400px', height: '4px', background: 'var(--gold)', transformOrigin: '50% 50%' });
  const c = E(g, 'シ リ ー ズ', 0, 710, 'a mc', 1920); c.style.fontSize = '56px'; c.style.color = 'var(--gold)';
  return (lt, S) => { show(tag, appear(lt, 0.05)); show(a, appear(lt, 0.15)); show(b, appear(lt, 0.55, 0.6), 30, 0.92); rule.style.transform = `scaleX(${eio(appear(lt, 1.3, 0.6))})`; show(c, appear(lt, 1.8)); };
});
// 2 payday
G([1, 2, 3], ['01', 'FIRST SALARY'], ['はじめての給料', '給料から<br><em>引かれるもの</em>'], (g) => {
  const h = H2(g, 'はじめての<em>給料</em>');
  const p = E(g, circ(IC.person(), 220), 330, 360); const tg = E(g, '新社会人', 330, 600, 'a pill gold');
  const card = E(g, '<div style="font-size:24px;font-weight:700;letter-spacing:.3em;color:#8a8f99;margin-bottom:18px">給与明細</div>', 760, 290, 'a card', 600); card.style.padding = '36px 44px';
  const rows = [['支給額', 300, ''], ['健康保険料', 110, 's'], ['厚生年金', 170, 's'], ['雇用保険', 40, 's'], ['所得税', 60, 't']].map(([n, w, k]) => { const r = document.createElement('div'); r.className = 'row'; r.innerHTML = `<div class="mk" style="background:${k === 't' ? 'rgba(207,74,60,.13)' : 'rgba(29,41,64,.08)'}"></div><span>${n}</span><div class="bar" style="background:${k === 't' ? '#cf4a3c' : (k ? '#5a6f96' : '#d8dde6')}"></div>`; r.dataset.w = w; r.dataset.k = k; card.appendChild(r); return r; });
  const br = E(g, '<div style="width:16px;height:186px;border:4px solid #5a6f96;border-left:none;border-radius:0 12px 12px 0"></div>', 1380, 445); const bl = E(g, '社会保険料', 1410, 515, 'a lab'); bl.style.color = '#5a6f96';
  const tl = E(g, '税金', 1410, 637, 'a lab'); tl.style.color = 'var(--red)';
  return (lt, S) => { show(h, appear(lt, 0.1)); show(p, appear(lt, 0.3), 20, 0.8); show(tg, appear(lt, 0.7), 10, 0.8); show(card, appear(lt, S[1] - 0.3, 0.6), 50);
    rows.forEach((r, i) => { const k = eo(appear(lt, S[1] + i * 0.18)); r.style.opacity = k; r.querySelector('.bar').style.width = r.dataset.w * k + 'px'; if (r.dataset.k) r.querySelector('.mk').style.transform = `scaleX(${eio(appear(lt, S[2] + (r.dataset.k === 't' ? 0.9 : 0.2), 0.45))})`; });

  const line = E(g, '', 360, 520, 'a'); Object.assign(line.style, { width: '1200px', height: '4px', background: '#cfc8ba', transformOrigin: '0 50%' });
  const n1 = E(g, '<div style="width:34px;height:34px;border-radius:50%;background:var(--navy)"></div>', 460, 505); const l1 = E(g, '1年目', 400, 560, 'a lab', 150);
  const n2 = E(g, '<div style="width:34px;height:34px;border-radius:50%;background:var(--red)"></div>', 1300, 505); const l2 = E(g, '2年目', 1240, 560, 'a lab', 150);
