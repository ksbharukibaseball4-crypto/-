<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-jp/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-jp/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-jp/900.css">
<link rel="stylesheet" href="extra/node_modules/@fontsource/inter/600.css">
<link rel="stylesheet" href="extra/node_modules/@fontsource/inter/800.css">
<link rel="stylesheet" href="extra/node_modules/@fontsource/shippori-mincho/800.css">
<style>
:root{--ink:#14171d;--navy:#1d2940;--gold:#c79a3e;--red:#cf4a3c;--mute:#8a8f99;--line:#d9d4c8;--paper:#f5f2ec}
*{box-sizing:border-box}
html,body{margin:0;overflow:hidden;font-family:"Noto Sans JP";background:#0f141d}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;background:radial-gradient(ellipse at 50% 40%,#fbf9f5 0%,#f1ede5 70%,#e7e1d6 100%);overflow:hidden;transform-origin:0 0}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(20,23,29,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(20,23,29,.035) 1px,transparent 1px);background-size:60px 60px}
.chap{position:absolute;left:96px;top:72px;font-family:"Inter";font-weight:600;font-size:22px;letter-spacing:.32em;color:var(--mute)}
.chap b{color:var(--ink);font-weight:800;margin-right:22px}
.asof{position:absolute;right:96px;top:72px;font-size:20px;font-weight:700;color:var(--mute);letter-spacing:.08em}
.scene{position:absolute;inset:0}
.h2{position:absolute;left:0;width:1920px;top:150px;text-align:center;font-family:"Shippori Mincho";font-weight:800;font-size:64px;color:var(--ink);letter-spacing:.04em}
.h2 em{font-style:normal;color:var(--red)}
.card{position:absolute;left:520px;top:290px;width:560px;height:530px;background:#fff;border-radius:22px;box-shadow:0 30px 60px rgba(30,25,15,.12),0 2px 6px rgba(30,25,15,.06);padding:44px 48px}
.card h3{margin:0 0 26px;font-size:26px;font-weight:700;letter-spacing:.3em;color:var(--mute)}
.row{display:flex;align-items:center;justify-content:space-between;height:66px;border-bottom:1px solid #eee9df;font-size:30px;font-weight:700;color:var(--ink);position:relative}
.row .bar{height:12px;border-radius:6px;background:#d8dde6}
.row.tax .bar{background:var(--red)}
.mk{position:absolute;left:-14px;right:-14px;top:9px;bottom:9px;background:rgba(207,74,60,.12);border-radius:10px;transform-origin:0 50%}
.call{position:absolute;left:1250px;top:655px;font-size:46px;font-weight:900;color:var(--red)}
.call small{display:block;font-size:24px;color:var(--mute);font-weight:700;letter-spacing:.1em;margin-top:6px}
.node{position:absolute;width:240px;text-align:center;font-size:34px;font-weight:900;color:var(--ink)}
.node .ic{width:200px;height:200px;margin:0 auto 18px;border-radius:50%;background:#fff;box-shadow:0 20px 40px rgba(30,25,15,.10);display:flex;align-items:center;justify-content:center}
.pill{position:absolute;padding:10px 30px;border-radius:999px;background:var(--navy);color:#fff;font-size:30px;font-weight:700;letter-spacing:.08em;white-space:nowrap}
.coin{position:absolute;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f1d58d,#c79a3e 60%,#9d7428);box-shadow:0 8px 16px rgba(80,55,10,.25),inset 0 0 0 5px rgba(255,255,255,.25)}
.coin.r{background:radial-gradient(circle at 35% 30%,#f2a397,#cf4a3c 60%,#9e2f25)}
.bars{position:absolute;left:330px;top:330px;width:1260px;height:520px}
.b{position:absolute;bottom:0;width:120px;border-radius:14px 14px 4px 4px;background:linear-gradient(180deg,#2a3a5c,#1d2940)}
.b.hi{background:linear-gradient(180deg,#e06a5d,#cf4a3c)}
.pct{position:absolute;width:120px;text-align:center;font-family:"Inter";font-weight:800;font-size:40px;color:var(--ink)}
.lbl{position:absolute;width:150px;text-align:center;font-size:20px;font-weight:700;color:var(--mute)}
.axis{position:absolute;left:300px;right:300px;top:850px;height:2px;background:var(--ink);opacity:.25;transform-origin:0 50%}
.sub{position:absolute;left:0;width:1920px;top:950px;text-align:center}
.sub span{display:inline-block;background:rgba(20,23,29,.86);color:#fff;font-size:44px;font-weight:700;padding:12px 36px;border-radius:14px}
.sub i{font-style:normal;transition:none}
/* vertical */
body.v{width:1080px;height:1920px}
body.h{width:1920px;height:1080px}
#vbg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,#1f2b44 0%,#0f141d 70%);display:none}
body.v #vbg{display:block}
#vhead{display:none;position:absolute;left:0;width:1080px;top:230px;text-align:center;color:#fff}
body.v #vhead{display:block}
#vhead .tag{display:inline-block;font-size:28px;font-weight:700;letter-spacing:.3em;color:var(--gold);border:2px solid rgba(199,154,62,.6);padding:6px 26px;border-radius:999px;margin-bottom:26px}
#vhead .t{font-family:"Shippori Mincho";font-weight:800;font-size:76px;line-height:1.3}
#vhead .t em{font-style:normal;color:#f0b8ae}
body.v #stage{border-radius:26px;box-shadow:0 30px 70px rgba(0,0,0,.55)}
#vsub{display:none;position:absolute;left:60px;width:960px;top:1205px;text-align:center;color:#fff;font-size:58px;font-weight:900;line-height:1.35}
body.v #vsub{display:block}
#vsub i{font-style:normal}
body.v .sub{display:none}
</style></head><body>
<div id="vbg"></div>
<div id="vhead"><div class="tag">所得税のしくみ</div><div class="t">給料から引かれる<br><em>所得税</em>の正体</div></div>
<div id="stage"><div class="grid"></div>
 <div class="chap"><b>01</b>INCOME TAX</div><div class="asof">2026年11月時点</div>
 <!-- A -->
 <div class="scene" id="A">
  <div class="h2" id="Ah">給料から引かれている<em>「所得税」</em></div>
  <div class="card" id="Acard"><h3>給与明細</h3>
   <div class="row" data-w="300"><span>支給額</span><div class="bar"></div></div>
   <div class="row" data-w="110"><span>健康保険料</span><div class="bar"></div></div>
   <div class="row" data-w="170"><span>厚生年金</span><div class="bar"></div></div>
   <div class="row" data-w="40"><span>雇用保険</span><div class="bar"></div></div>
   <div class="row tax" data-w="60"><div class="mk" id="Amk"></div><span>所得税</span><div class="bar"></div></div>
   <div class="row" data-w="90"><span>住民税</span><div class="bar"></div></div>
  </div>
  <svg id="Aline" style="position:absolute;left:0;top:0" width="1920" height="1080"><path d="M1066 690 C 1130 690, 1160 690, 1230 690" stroke="#cf4a3c" stroke-width="3" fill="none" stroke-dasharray="200" stroke-dashoffset="200"/><circle cx="1066" cy="690" r="7" fill="#cf4a3c"/></svg>
  <div class="call" id="Acall">これが所得税<small>会社が毎月 天引きしている</small></div>
 </div>
 <!-- B -->
 <div class="scene" id="B">
  <div class="h2" id="Bh">会社が先に引いて、<em>国に納める</em></div>
  <div class="node" id="Bco" style="left:300px;top:420px"><div class="ic"><svg width="110" height="110" viewBox="0 0 110 110" fill="none" stroke="#1d2940" stroke-width="5" stroke-linejoin="round"><rect x="22" y="14" width="66" height="86"/><path d="M36 30h12M62 30h12M36 48h12M62 48h12M36 66h12M62 66h12M48 100V84h14v16"/></svg></div>会社</div>
  <div class="node" id="Byou" style="left:840px;top:420px"><div class="ic"><svg width="110" height="110" viewBox="0 0 110 110" fill="none" stroke="#1d2940" stroke-width="5" stroke-linecap="round"><circle cx="55" cy="36" r="18"/><path d="M22 98c4-22 18-32 33-32s29 10 33 32"/></svg></div>あなた</div>
  <div class="node" id="Bkuni" style="left:1380px;top:420px"><div class="ic"><svg width="120" height="110" viewBox="0 0 120 110" fill="none" stroke="#cf4a3c" stroke-width="5" stroke-linejoin="round"><path d="M12 38 L60 12 L108 38 Z"/><path d="M22 46v40M44 46v40M76 46v40M98 46v40M10 96h100"/></svg></div>国（税務署）</div>
  <svg id="Bpath" style="position:absolute;left:0;top:0" width="1920" height="1080"><path id="Bp1" d="M545 520 L 835 520" stroke="#c79a3e" stroke-width="4" fill="none" stroke-dasharray="10 12"/><path id="Bp2" d="M520 470 C 760 220, 1240 220, 1440 430" stroke="#cf4a3c" stroke-width="4" fill="none" stroke-dasharray="10 12"/></svg>
  <div class="pill" id="Bpill" style="left:860px;top:250px">源泉徴収</div>
  <div class="coin" id="Bc1"></div><div class="coin" id="Bc2"></div><div class="coin r" id="Bc3"></div>
 </div>
 <!-- C -->
 <div class="scene" id="C">
  <div class="h2" id="Ch">税率は<em>5%〜45%</em>の7段階</div>
  <div class="axis" id="Cax"></div>
  <div class="bars" id="Cbars"></div>
  <div class="lbl" id="Cnote" style="left:0;width:1920px;top:250px;font-size:24px">課税所得が増えるほど、上の段の税率がかかる（超過累進）</div>
 </div>
 <div class="sub" id="sub"><span id="subt"></span></div>
</div>
<div id="vsub"></div>
<script>
const Q = new URLSearchParams(location.search); const MODE = Q.get('m') || 'h';
document.body.classList.add(MODE);
const stage = document.getElementById('stage');
if (MODE === 'v') { const s = 1000 / 1920; stage.style.transform = `translate(40px, 640px) scale(${s})`; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const eo = (x) => 1 - Math.pow(1 - clamp(x), 3);           // ease out cubic
const eio = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const back = (x) => { x = clamp(x); const c = 1.5; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const $ = (id) => document.getElementById(id);
const set = (el, o, tx = 0, ty = 0, sc = 1) => { el.style.opacity = o; el.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`; };
// scenes: [start,end]
const SC = { A: [0, 5], B: [5, 10], C: [10, 15] };
const SUBS = [[0.3, 5, ['給料から引かれている', '「所得税」。']], [5.1, 10, ['会社が先に差し引いて、', '国に納めます。']], [10.1, 15, ['税率は5%〜45%。', '所得が多いほど上がります。']]];
const RATES = [5, 10, 20, 23, 33, 40, 45]; const LBL = ['〜195万', '〜330万', '〜695万', '〜900万', '〜1800万', '〜4000万', '4000万超'];
const bars = $('Cbars'); RATES.forEach((r, i) => { bars.insertAdjacentHTML('beforeend', `<div class="b" id="b${i}" style="left:${i * 180}px"></div><div class="pct" id="p${i}" style="left:${i * 180}px">${r}%</div><div class="lbl" style="left:${i * 180 - 15}px;top:540px">${LBL[i]}</div>`); });
function sceneAlpha(id, t) { const [a, b] = SC[id]; const i = eo((t - a) / 0.5), o = 1 - eio((t - (b - 0.45)) / 0.45); return (id === 'C') ? i : Math.min(i, o); }
window.renderAt = (t) => {
  // gentle global drift (camera)
  const drift = 1 + 0.012 * Math.sin(t * 0.4);
  ['A', 'B', 'C'].forEach((id) => { const a = sceneAlpha(id, t); const el = $(id); el.style.opacity = a; el.style.display = a > 0.001 ? 'block' : 'none';
    const [s0] = SC[id]; el.style.transform = `translateY(${(1 - eo((t - s0) / 0.6)) * 40}px) scale(${drift})`; el.style.transformOrigin = '50% 50%'; });
  // A
  { const lt = t; set($('Ah'), eo((lt - 0.15) / 0.5), 0, (1 - eo((lt - 0.15) / 0.5)) * 24);
    set($('Acard'), eo((lt - 0.3) / 0.6), 0, (1 - eo((lt - 0.3) / 0.6)) * 50);
    document.querySelectorAll('#Acard .row').forEach((r, i) => { const k = eo((lt - 0.7 - i * 0.16) / 0.5); r.style.opacity = k; r.querySelector('.bar').style.width = (r.dataset.w * k) + 'px'; });
    $('Amk').style.transform = `scaleX(${eio((lt - 2.0) / 0.5)})`;
    $('Aline').querySelector('path').style.strokeDashoffset = 200 * (1 - eio((lt - 2.4) / 0.5)); $('Aline').style.opacity = lt > 2.35 ? 1 : 0;
    set($('Acall'), eo((lt - 2.8) / 0.5), (1 - eo((lt - 2.8) / 0.5)) * -20, 0); }
  // B
  { const lt = t - 5; set($('Bh'), eo((lt - 0.1) / 0.5), 0, (1 - eo((lt - 0.1) / 0.5)) * 24);
    [['Bco', 0.3], ['Byou', 0.5], ['Bkuni', 0.7]].forEach(([id, d]) => set($(id), eo((lt - d) / 0.5), 0, 0, 0.85 + 0.15 * back((lt - d) / 0.6)));
    const p1 = $('Bp1'), p2 = $('Bp2'); p1.style.opacity = eo((lt - 1.0) / 0.4); p2.style.opacity = eo((lt - 2.1) / 0.4);
    p1.style.strokeDashoffset = -lt * 40; p2.style.strokeDashoffset = -lt * 40;
    const L2 = p2.getTotalLength();
    const cpos = (k, d) => { const q = clamp((lt - d) / 1.4); return eio(q); };
    // coins 1,2: company -> you
    [['Bc1', 1.2], ['Bc2', 1.45]].forEach(([id, d]) => { const k = cpos(0, d); const x = 510 + (870 - 510) * k, y = 488; set($(id), lt > d ? 1 : 0, x, y); });
    // coin 3 (tax): company -> nation over the arc, starts later
    { const k = eio(clamp((lt - 2.3) / 1.8)); const pt = p2.getPointAtLength(L2 * k); set($('Bc3'), lt > 2.3 ? 1 : 0, pt.x - 32, pt.y - 32, 1 + 0.15 * Math.sin(k * Math.PI)); }
    set($('Bpill'), eo((lt - 2.6) / 0.5), 0, (1 - eo((lt - 2.6) / 0.5)) * 16, 0.9 + 0.1 * back((lt - 2.6) / 0.5)); }
  // C
  { const lt = t - 10; set($('Ch'), eo((lt - 0.1) / 0.5), 0, (1 - eo((lt - 0.1) / 0.5)) * 24);
    $('Cax').style.transform = `scaleX(${eio((lt - 0.3) / 0.7)})`;
    RATES.forEach((r, i) => { const k = back((lt - 0.6 - i * 0.22) / 0.55); const h = r / 45 * 440 * Math.max(0, k); const b = $('b' + i);
      b.style.height = h + 'px'; b.className = 'b' + (lt > 0.6 + i * 0.22 + 0.4 && i === Math.min(6, Math.floor((lt - 0.6) / 0.22) - 1) ? ' hi' : '');
      const p = $('p' + i); p.style.top = (520 - h - 56) + 'px'; p.style.opacity = eo((lt - 0.8 - i * 0.22) / 0.3); });
    if (lt > 3.0) $('b6').className = 'b hi';
    $('Cnote').style.opacity = eo((lt - 2.8) / 0.6); }
  // subtitles (current chunk = gold)
  let s = SUBS.find(([a, b]) => t >= a && t < b); const subt = $('subt'), vs = $('vsub');
  if (s) { const [a, b, ch] = s; const per = (b - a - 0.6) / ch.length; const cur = Math.min(ch.length - 1, Math.floor((t - a) / per));
    const html = ch.map((c, i) => `<i style="color:${i === cur ? '#f0c766' : (i < cur ? '#fff' : 'rgba(255,255,255,.45)')}">${c}</i>`);
    subt.innerHTML = html.join(''); subt.parentElement.style.opacity = eo((t - a) / 0.25); vs.innerHTML = html.join('<br>'); vs.style.opacity = eo((t - a) / 0.25);
  } else { subt.parentElement.style.opacity = 0; vs.style.opacity = 0; }
};
document.fonts.ready.then(() => { window.renderAt(0); window.ready = true; });
</script></body></html>
