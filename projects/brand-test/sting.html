<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-jp/700.css"><link rel="stylesheet" href="node_modules/@fontsource/noto-sans-jp/900.css">
<link rel="stylesheet" href="extra/node_modules/@fontsource/shippori-mincho/800.css"><link rel="stylesheet" href="extra/node_modules/@fontsource/inter/600.css">
<style>
*{box-sizing:border-box} html,body{margin:0;overflow:hidden;background:#0f141d;font-family:"Noto Sans JP"}
body.h{width:1920px;height:1080px} body.v{width:1080px;height:1920px}
#bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,#24324f 0%,#111827 60%,#0b0f17 100%)}
#rays{position:absolute;left:50%;top:42%;width:1600px;height:1600px;margin:-800px 0 0 -800px;background:repeating-conic-gradient(rgba(199,154,62,.07) 0 6deg,transparent 6deg 18deg);border-radius:50%}
#wrap{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%)}
#ring{position:absolute;left:-210px;top:-210px;width:420px;height:420px}
#face{position:absolute;left:-180px;top:-180px;width:360px;height:360px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 40%,#f6efe2,#e3d6bf)}
#face img{position:absolute;width:900px;left:-262px;top:-2px}
#name{position:absolute;left:-600px;width:1200px;top:240px;text-align:center;color:#fff}
#name .s{font-size:30px;font-weight:700;letter-spacing:.35em;color:#c79a3e}
#name .t{font-family:"Shippori Mincho";font-weight:800;font-size:84px;margin-top:10px}
#name .t em{font-style:normal;color:#e9c46a}
#cta{position:absolute;left:-600px;width:1200px;top:420px;text-align:center}
#cta span{display:inline-block;background:#c79a3e;color:#111827;font-weight:900;font-size:40px;padding:14px 48px;border-radius:999px}
body.v #wrap{top:38%} body.v #rays{top:38%} body.v #name .t{font-size:72px}
</style></head><body><div id="bg"></div><div id="rays"></div>
<div id="wrap"><svg id="ring" viewBox="0 0 420 420"><circle cx="210" cy="210" r="196" fill="none" stroke="#c79a3e" stroke-width="6" stroke-dasharray="1232" stroke-dashoffset="1232" stroke-linecap="round" transform="rotate(-90 210 210)"/></svg>
<div id="face"><img src="tiger_head.png"></div>
<div id="name"><div class="s" id="s">本当は学校で教えて欲しい</div><div class="t" id="t">トラ先生の<em>お金の授業</em></div></div>
<div id="cta"><span>次回もお楽しみに</span></div></div>
<script>
const Q = new URLSearchParams(location.search); const MODE = Q.get('m') || 'h'; const KIND = Q.get('k') || 'intro'; document.body.classList.add(MODE);
const clamp = (x) => Math.min(1, Math.max(0, x)); const eo = (x) => 1 - Math.pow(1 - clamp(x), 3);
const back = (x) => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const $ = (i) => document.getElementById(i);
window.renderAt = (t) => {
  const D = KIND === 'intro' ? 2.6 : 3.2;
  $('rays').style.transform = `rotate(${t * 12}deg) scale(${0.8 + 0.2 * eo(t / 0.8)})`; $('rays').style.opacity = eo(t / 0.6);
  $('ring').querySelector('circle').style.strokeDashoffset = 1232 * (1 - eo((t - 0.1) / 0.7));
  const f = back((t - 0.35) / 0.5); $('face').style.transform = `scale(${f})`; $('face').style.opacity = clamp((t - 0.35) / 0.15);
  $('face').querySelector('img').style.transform = `rotate(${Math.sin(t * 6) * 3 * Math.exp(-Math.max(0, t - 0.8) * 1.5)}deg)`;
  const n = eo((t - 0.9) / 0.5); $('name').style.opacity = n; $('name').style.transform = `translateY(${(1 - n) * 30}px)`;
  $('cta').style.display = KIND === 'outro' ? 'block' : 'none'; const c = back((t - 1.5) / 0.5); $('cta').style.opacity = clamp((t - 1.5) / 0.2); $('cta').style.transform = `scale(${c})`;
  const out = KIND === 'intro' ? 1 - clamp((t - (D - 0.3)) / 0.3) : 1; document.body.style.opacity = out;
};
document.fonts.ready.then(() => { const im = $('face').querySelector('img'); const go = () => { window.renderAt(0); window.ready = true; }; im.complete ? go() : im.onload = go; });
</script></body></html>
