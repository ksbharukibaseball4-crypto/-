<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-jp/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-jp/900.css">
<link rel="stylesheet" href="node_modules/@fontsource/zen-maru-gothic/900.css">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#111;font-family:"Noto Sans JP"}
.bgblur{position:absolute;inset:-60px;background:url(classroom.png) center/cover;filter:blur(30px) brightness(.5);background-position:center 30%}
.main{position:absolute;left:0;top:0;width:1080px;height:1920px;background:url(classroom.png) no-repeat;background-size:4013px 2258px;background-position:-1180px 260px;filter:saturate(1.05) contrast(1.03);-webkit-mask-image:linear-gradient(180deg,transparent 260px,#000 560px)}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 100%),linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 70%,rgba(0,0,0,.5) 100%)}
.tel{position:absolute;top:250px;left:0;width:1080px;text-align:center;font-family:"Zen Maru Gothic";font-weight:900;font-size:80px;line-height:1.25;color:#fff;
 text-shadow:0 0 2px #000,0 4px 0 #000,4px 0 0 #000,-4px 0 0 #000,0 -4px 0 #000,3px 3px 0 #000,-3px 3px 0 #000,3px -3px 0 #000,-3px -3px 0 #000,0 10px 24px rgba(0,0,0,.6)}
.tel .em{color:#ffd84a}
.spk{display:inline-block;font-size:34px;background:#1f8f6a;color:#fff;padding:4px 24px;border-radius:999px;text-shadow:none;margin-bottom:16px}
.flow{position:absolute;left:90px;top:1250px;width:900px;display:flex;align-items:center;justify-content:center;gap:18px}
.box{background:rgba(255,255,255,.95);border-radius:22px;padding:18px 26px;font-weight:900;font-size:42px;color:#1b1d22;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.box small{display:block;font-size:24px;font-weight:700;color:#6b6f78;text-align:center}
.arr{font-size:30px;font-weight:900;color:#fff;text-align:center;text-shadow:0 2px 6px #000}
.arr b{display:block;font-size:54px;line-height:1;color:#ffd84a}
.red{background:#e0453b;color:#fff}.red small{color:#ffe1dc}
.ring{position:absolute;left:600px;top:760px;width:300px;height:170px;border:7px solid #ffd84a;border-radius:50%;transform:rotate(-6deg);box-shadow:0 0 18px rgba(255,216,74,.6)}
</style></head><body>
<div class="bgblur"></div><div class="main"></div><div class="vig"></div>

<div class="flow"><div class="box">会社<small>給料を払う</small></div><div class="arr"><b>→</b>先に引く</div><div class="box red">税金<small>天引き</small></div><div class="arr"><b>→</b>納める</div><div class="box">国<small>税務署</small></div></div>
<div class="tel"><span class="spk">先生</span><br>そこで会社が<br>給料から<span class="em">先に引いて</span><br>国に納めます。</div>
<script>const im=new Image();im.src='classroom.png';im.onload=async()=>{await document.fonts.ready;window.ready=true}</script>
</body></html>
