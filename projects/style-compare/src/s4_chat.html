<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-jp/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-jp/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-jp/900.css">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;font-family:"Noto Sans JP";background:linear-gradient(160deg,#1d2b4f 0%,#2f4a7d 55%,#6c8ccf 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55}
.head{position:absolute;top:200px;left:0;width:1080px;text-align:center;color:#fff;font-weight:900;font-size:64px;line-height:1.3}
.head .em{color:#ffd84a}
.phone{position:absolute;left:170px;top:420px;width:740px;height:1500px;border-radius:72px;background:#0d1220;box-shadow:0 40px 80px rgba(0,0,0,.45),inset 0 0 0 3px #3a445c}
.scr{position:absolute;left:18px;top:18px;right:18px;bottom:0;border-radius:56px 56px 0 0;background:#eef1f6;overflow:hidden}
.bar{height:120px;background:#fff;display:flex;align-items:center;gap:20px;padding:30px 34px 0;box-sizing:border-box;border-bottom:1px solid #dde2ea}
.av{width:64px;height:64px;border-radius:50%;background:#2f6fd6;color:#fff;font-weight:900;font-size:32px;display:flex;align-items:center;justify-content:center}
.nm{font-weight:700;font-size:32px;color:#1b2333}.nm small{display:block;font-size:20px;color:#7a8496;font-weight:500}
.msgs{padding:30px 28px;display:flex;flex-direction:column;gap:22px}
.m{max-width:500px;padding:20px 28px;border-radius:34px;font-size:34px;line-height:1.45;font-weight:500;color:#1b2333}
.l{background:#fff;align-self:flex-start;border-bottom-left-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.r{background:#2f6fd6;color:#fff;align-self:flex-end;border-bottom-right-radius:10px}
.b{font-weight:900;color:#d23b31}
.card{align-self:flex-start;width:520px;background:#fff;border-radius:30px;padding:26px 28px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.card h4{margin:0 0 18px;font-size:28px;color:#7a8496;font-weight:700}
.row{display:flex;justify-content:space-between;font-size:28px;font-weight:700;color:#1b2333;margin:10px 0 6px}
.track{height:34px;border-radius:12px;background:#e6eaf1;display:flex;overflow:hidden}
.seg{height:100%}
.tag{display:inline-block;margin-top:16px;background:#fde8e6;color:#d23b31;font-weight:900;font-size:26px;padding:6px 18px;border-radius:999px}
.typing{align-self:flex-start;background:#fff;border-radius:30px;padding:22px 30px;display:flex;gap:10px}
.typing i{width:14px;height:14px;border-radius:50%;background:#a9b2c3;display:block}
.hl{box-shadow:0 0 0 6px rgba(255,216,74,.9),0 10px 30px rgba(0,0,0,.2)}
</style></head><body>
<div class="blob" style="width:600px;height:600px;left:-200px;top:1100px;background:#ffd84a"></div>
<div class="blob" style="width:500px;height:500px;left:700px;top:200px;background:#7fb2ff"></div>
<div class="head">給料から<span class="em">先に引かれる</span>理由</div>
<div class="phone"><div class="scr">
 <div class="bar"><div class="av">先</div><div class="nm">お金の先生<small>オンライン</small></div></div>
 <div class="msgs">
  <div class="m r">初めての給料、思ったより少ない…</div>
  <div class="m l">会社が<span class="b">先に税金を引いて</span>、国に納めてくれているんです。</div>
  <div class="card hl"><h4>給与明細（イメージ）</h4>
   <div class="row"><span>給料</span><span style="color:#7a8496">100%</span></div>
   <div class="track"><div class="seg" style="width:100%;background:#9fb9e6"></div></div>
   <div class="row" style="margin-top:20px"><span>手取り</span><span style="color:#d23b31">－ 天引き</span></div>
   <div class="track"><div class="seg" style="width:78%;background:#2f6fd6"></div><div class="seg" style="width:22%;background:repeating-linear-gradient(45deg,#e0574d 0 10px,#f08a82 10px 20px)"></div></div>
   <span class="tag">税金・社会保険料 → 国などへ</span></div>
  <div class="m l">これを<span class="b">「源泉徴収」</span>といいます。</div>
  <div class="typing"><i></i><i></i><i></i></div>
 </div></div></div>
<script>document.fonts.ready.then(()=>{window.ready=true})</script>
</body></html>
